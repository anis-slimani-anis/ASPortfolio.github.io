<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Tight bloom hugging the mark, fading fast: reads as a lit edge
         rather than a cloud, and holds up at small sizes. -->
    <radialGradient id="halo">
      <stop offset="0.44" stop-color="#8b99fb" stop-opacity="0.92"/>
      <stop offset="0.53" stop-color="#8b99fb" stop-opacity="0.55"/>
      <stop offset="0.66" stop-color="#8b99fb" stop-opacity="0.22"/>
      <stop offset="0.82" stop-color="#8b99fb" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#8b99fb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16" fill="url(#halo)"/>
  <circle cx="16" cy="16" r="7" fill="#0d0b14"/>
</svg>
